[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-llm-auto"
version = "0.1.0"
description = "Word-aligned + LLM-authored YouTube documentary visual pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "openai-whisper>=20250625",
]

[project.optional-dependencies]
advanced-alignment = [
  "whisperx>=3.8.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
